# =============================================================================
# METADATA LEVELS CONFIGURATION
# =============================================================================

METADATA_LEVELS:
  standard:
    fields:
      - id
      - type
      - project
      - version
      - created
      - status
      - generated_by
      
  extended:
    fields:
      - id
      - type
      - project
      - version
      - created
      - updated
      - status
      - generated_by
      - word_count
      - processing_time
      - source_artifacts
      - quality_metrics
      - next_step

# =============================================================================
# VERSION CONTROL SETTINGS
# =============================================================================

VERSION_CONTROL:
  initial_version: "1.0"
  increment_minor: "0.1"  # v1.0 → v1.1 → v1.2
  increment_major: "1.0"  # v1.9 → v2.0
  
  minor_criteria:
    - "Correcciones menores"
    - "Añadidos que no cambian estructura"
    - "Actualizaciones de metadatos"
    
  major_criteria:
    - "Reescritura significativa"
    - "Cambio de estructura"
    - "Nueva versión del prompt que lo genera"

# =============================================================================
# NAMING UTILITIES
# =============================================================================

NAMING_RULES:
  project_code:
    max_length: 10
    allowed_chars: "A-Z0-9_"
    
  post_name:
    max_length: 40
    transform: "title_case_to_snake_case"  # "Frankenstein Tenía Razón" → "Frankenstein_Tenia_Razon"
    remove_chars: [".", ",", ":", ";", "!", "?", "'", '"']

  post_folder:
    format: "Post{post_number}_{post_name}"  # "Post1_Frankenstein_Tenia_Razon"
    post_number: "sequential"  # 1, 2, 3... — el siguiente número del proyecto, no se reutiliza
    scope: "per_project"  # el contador vive en PROJECT_CONFIG, no es global
    created_when: "primer artefacto de un post nuevo"  # no se pre-crea en TOOL_CREATE_PROJECT

  chapter_number:
    format: "zero_padded"  # 1 → 01, 10 → 10
    max_digits: 2
    
  plan_number:
    format: "sequential"  # P1, P2, P3...
    prefix: "P"

# =============================================================================
# ERROR HANDLING
# =============================================================================
#
# REGLA ABSOLUTA (issue #65 — pérdida silenciosa de datos): ante CUALQUIER
# fallo al guardar en la carpeta destino (conexión, permisos, carpeta no
# encontrada), está PROHIBIDO:
#   - Guardar en la carpeta raíz del proyecto ni en ninguna otra carpeta
#     distinta a la que corresponde al tipo de artefacto.
#   - Reintentar con una búsqueda de carpeta "parecida" por nombre.
#   - Continuar sin que el editor sepa que el guardado automático falló.
# En su lugar, SIEMPRE: (1) reportar el error exacto — qué carpeta, qué tipo
# de fallo; (2) presentar el contenido completo del artefacto en el chat;
# (3) dar la ruta y nombre de archivo exactos para guardarlo a mano. Nunca
# "guardo en la carpeta principal como alternativa" — eso es exactamente el
# comportamiento que causó #65 en producción.

ERROR_HANDLING:
  fallback_behavior: "present_manual_content"
  retry_attempts: 3
  timeout_seconds: 30

  error_types:
    drive_connection:
      action: "present_content_for_manual_save"
      message: "Auto-save no disponible. Contenido presentado para guardado manual."

    folder_permission_denied:
      action: "present_content_for_manual_save"
      message: "Sin permiso de escritura en la carpeta destino. NUNCA guardar en otra carpeta como alternativa — presentar contenido completo + ruta/nombre exactos para guardado manual, y reportar el ID/nombre de la carpeta que falló."
      # Añadido issue #65: caso específico y más frecuente que drive_connection
      # genérico — un fallo de permisos en UNA subcarpeta no significa que
      # Drive esté inaccesible, así que el editor necesita saber exactamente
      # cuál fue.

    file_exists:
      action: "increment_version"
      message: "Archivo existente detectado. Versión incrementada automáticamente."
      
    invalid_config:
      action: "use_generic_naming"
      message: "Configuración incompleta. Usando naming genérico."
      
    unknown_artifact:
      action: "use_generic_template"
      message: "Tipo de artefacto no reconocido. Registry necesita actualización."

    folder_missing:
      action: "create_folder_before_write"
      message: "Carpeta destino no existe (ej. {post_folder} de un post nuevo). Se crea antes de guardar — nunca se reutiliza ni se adivina una carpeta existente por coincidencia de nombre."
      # Añadido v1.1 (issue #74/#49): la resolución de carpeta debe ser explícita
      # (crear si falta) en vez de buscar/reutilizar la carpeta "más parecida",
      # que es el patrón que causó las subcarpetas duplicadas de #49.
