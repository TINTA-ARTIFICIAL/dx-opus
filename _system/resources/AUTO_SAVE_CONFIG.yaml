# =============================================================================
# WRITING POST ARTIFACTS
# =============================================================================
#
# ESTRUCTURA POR POST (v1.1, issue #74): cada post de una serie vive en su
# propia subcarpeta dentro de WP_writing_post/, no en una carpeta plana
# compartida. {post_folder} se calcula como Post{post_number}_{post_name}
# (ver NAMING_RULES.post_folder más abajo). La subcarpeta se crea de forma
# dinámica al guardar el primer artefacto de un post nuevo — no se pre-crea
# en TOOL_CREATE_PROJECT.
#
# Artefactos específicos de un capítulo dentro del mismo post (ej. una serie
# de posts sobre un libro, con ideas/ángulos por capítulo) NO usan
# sub-subcarpetas — se diferencian por sufijo en el nombre de archivo dentro
# de la misma carpeta del post (ej. {..}_WP_ANGLES_Cap5_v1.0.md).

WRITING_POST:
  POST_SEED:
    folder: "WP_writing_post/{post_folder}"
    prefix: "SEED"
    template: "{project_code}_WP_SEED_{post_name}_v{version}.md"
    metadata_level: "standard"
    description: "Arquitectura y material para el post"

  POST_DRAFT:
    folder: "WP_writing_post/{post_folder}"
    prefix: "POST"
    template: "{project_code}_WP_POST_{post_name}_v{version}.md"
    metadata_level: "extended"
    description: "Borrador del post completo"

  INVENTARIO_IDEAS:
    folder: "WP_writing_post/{post_folder}"
    prefix: "IDEAS"
    template: "{project_code}_WP_IDEAS_{post_name}_v{version}.md"
    metadata_level: "standard"
    description: "Q&A de ideas del editor"

  SOURCE_MAP:
    folder: "WP_writing_post/{post_folder}"
    prefix: "SOURCES"
    template: "{project_code}_WP_SOURCES_{post_name}_v{version}.md"
    metadata_level: "standard"
    description: "Mapa de fuentes procesadas"

  VERIFICATION_MAP:
    folder: "WP_writing_post/{post_folder}"
    prefix: "VERIFY"
    template: "{project_code}_WP_VERIFY_{post_name}_v{version}.md"
    metadata_level: "standard"
    description: "Resultado de verificación de fuentes"

  ANGLES_REPORT:
    folder: "WP_writing_post/{post_folder}"
    prefix: "ANGLES"
    template: "{project_code}_WP_ANGLES_{post_name}_v{version}.md"
    metadata_level: "standard"
    description: "Ángulos y enfoques propuestos"

  POST_BRIEFING:
    folder: "WP_writing_post/{post_folder}"
    prefix: "BRIEFING"
    template: "{project_code}_WP_BRIEFING_{post_name}_v{version}.md"
    metadata_level: "standard"
    description: "Briefing de continuación entre sesiones"

